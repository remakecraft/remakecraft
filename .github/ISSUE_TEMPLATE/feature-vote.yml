name: Feature for the vote
description: Propose a Remakecraft feature. The top-voted proposals go into the next 3-day poll.
title: "feature: "
labels: ["feature-vote"]
body:
  - type: markdown
    attributes:
      value: |
        Features are picked by the [3-day community vote](https://github.com/remakecraft/remakecraft/blob/main/docs/feature-vote.md). Proposals with the most 👍 on this issue go into the next poll in [Discussions › Polls](https://github.com/remakecraft/remakecraft/discussions/categories/polls).

        One feature per issue. Search first; upvoting an existing proposal counts for more than a duplicate. Want an app cloned instead? Use the clone-request template.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Remakecraft should do. Keep it to something one release can ship.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wall and provenance
        - Inventory and spec
        - Tests and parity score
        - Build and review
        - Progress page and cost
        - Other agents (Codex, Cursor, Gemini CLI)
        - Docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: wall-impact
    attributes:
      label: Does it touch the clean-room wall?
      description: Anything that loosens the wall needs a strong case.
      options:
        - "No"
        - "Yes, it tightens it"
        - "Yes, it loosens it"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to build this myself if it wins the vote.
