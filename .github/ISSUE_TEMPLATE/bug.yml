name: Bug
description: Something in Remakecraft does not work as documented.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Found a way past the clean-room wall? **Do not file it here.** Report it privately: see [SECURITY.md](https://github.com/remakecraft/remakecraft/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /remakecraft:remake notepad --stack web
        2. Approve the spec
        3. ...
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Where in the run it went wrong.
      options:
        - "0 Setup"
        - "1 Inventory"
        - "2 Spec"
        - "3 Tests"
        - "4 Pilot"
        - "5 Build"
        - "6 Verify"
        - "7 Review"
        - "8 Report"
        - "Not in a run (install, docs, other)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Remakecraft version
      description: From `.claude-plugin/plugin.json` or `claude plugin list`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      placeholder: "claude --version"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Clone stack
      placeholder: "rust-egui, tauri, web, ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `.remake/wall.log`, `.remake/audit.log` or the terminal. Redact your home path if you like.
      render: text
