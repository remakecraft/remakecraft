<!doctype html>
<!--
  GitHub social preview, 1280x640. Rendered to ../social-card.png by
  `npm run mascot -- --card` (headless Playwright). The lettering and the
  drip pair are generated into parts/ from sprites.json and font.json; this
  file only places them and draws the 98-style window around the pair.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remakecraft social card</title>
<style>
  :root {
    --desk: #008080;
    --face: #c0c0c0;
    --light: #dfdfdf;
    --hi: #ffffff;
    --shade: #808080;
    --dark: #111111;
    --title: #000080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--desk); }
  img, svg { display: block; image-rendering: pixelated; }

  .words { position: absolute; left: 72px; top: 218px; }
  .words .tag { margin-top: 30px; display: grid; gap: 14px; }

  /* Win98 chrome at 2px per pixel, flat colours only: raised frame, sunken canvas. */
  .win {
    position: absolute; left: 688px; top: 131px; width: 528px; padding: 6px;
    background: var(--face);
    box-shadow: inset -2px -2px var(--dark), inset 2px 2px var(--light), inset -4px -4px var(--shade), inset 4px 4px var(--hi);
  }
  .bar {
    height: 36px; padding: 0 4px 0 10px; background: var(--title);
    display: flex; align-items: center; justify-content: space-between;
  }
  .btns { display: flex; gap: 2px; }
  .btns .b {
    width: 32px; height: 28px; background: var(--face);
    display: grid; place-items: center;
    box-shadow: inset -2px -2px var(--dark), inset 2px 2px var(--hi), inset -4px -4px var(--shade), inset 4px 4px var(--light);
  }
  .btns .b + .b + .b { margin-left: 4px; }
  .canvas {
    margin-top: 6px; padding: 24px; background: var(--hi);
    box-shadow: inset 2px 2px var(--shade), inset -2px -2px var(--hi), inset 4px 4px var(--dark), inset -4px -4px var(--light);
  }
</style>
</head>
<body>
  <div class="words">
    <img src="parts/wordmark.svg" alt="Remakecraft">
    <div class="tag">
      <img src="parts/tagline-1.svg" alt="Name an app,">
      <img src="parts/tagline-2.svg" alt="get a native rewrite.">
    </div>
  </div>

  <div class="win">
    <div class="bar">
      <img src="parts/title.svg" alt="untitled - Brushling">
      <div class="btns" aria-hidden="true">
        <span class="b"><svg width="16" height="14" viewBox="0 0 8 7" shape-rendering="crispEdges" fill="#111"><rect x="1" y="5" width="5" height="2"/></svg></span>
        <span class="b"><svg width="18" height="16" viewBox="0 0 9 8" shape-rendering="crispEdges" fill="#111"><rect x="0" y="0" width="9" height="2"/><rect x="0" y="2" width="1" height="6"/><rect x="8" y="2" width="1" height="6"/><rect x="1" y="7" width="7" height="1"/></svg></span>
        <span class="b"><svg width="16" height="14" viewBox="0 0 8 7" shape-rendering="crispEdges" fill="#111"><rect x="0" y="0" width="2" height="1"/><rect x="6" y="0" width="2" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="5" y="1" width="2" height="1"/><rect x="2" y="2" width="4" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="2" y="4" width="4" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="5" y="5" width="2" height="1"/><rect x="0" y="6" width="2" height="1"/><rect x="6" y="6" width="2" height="1"/></svg></span>
      </div>
    </div>
    <div class="canvas">
      <img src="parts/drip.svg" alt="Blot drips a trail of pixels that becomes Blit">
    </div>
  </div>
</body>
</html>
